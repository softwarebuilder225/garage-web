<mat-toolbar color="primary" class="app-toolbar">
  <mat-icon aria-hidden="true">directions_car</mat-icon>
  <span class="app-title">{{ title }}</span>
</mat-toolbar>

<main class="app-main">
  <mat-card class="welcome-card">
    <mat-card-header>
      <mat-card-title>Welcome, John</mat-card-title>
      <mat-card-subtitle>Your car catalogue is being set up</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p>
        This app will let you search, filter, sort, add cars, and download a CSV
        backup of your collection.
      </p>
      <p class="hint">
        Make sure the API is running on <code>http://localhost:3000</code> before
        we connect the catalogue.
      </p>
    </mat-card-content>

    <mat-card-actions>
      <a mat-button href="http://localhost:3000/api/health" target="_blank" rel="noopener">
        <mat-icon>link</mat-icon>
        Check API health
      </a>
    </mat-card-actions>
  </mat-card>
</main>
